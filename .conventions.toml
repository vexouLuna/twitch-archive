# Which version of vexouLuna/conventions this repo follows, and how.
# See https://github.com/vexouLuna/conventions#conventionstoml
version = "v4.0.0"
profile = "python-service"
flow = "dev"
extra_checks = ["image-worker / build"]   # the second image; `image` builds the api
# extra_workflows = []   # workflow files beyond ci.yml and publish.yml
status = { page = "https://status.vexoul.net", endpoints = ["api_vods-api", "api_keekivods-api"] }

[[json_badges]]
label = "vexoul VODs"
url = "https://vods.vexoul.net/backend/vods?$limit=0"
query = "$.total"

[[json_badges]]
label = "keeki_dechu VODs"
url = "https://keekivods.vexoul.net/backend/vods?$limit=0"
query = "$.total"
